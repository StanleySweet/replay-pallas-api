        data: |-
          {
            "id": 0,
            "nick": "",
            "role": 0
          }
  - name: 204 Response
    description: No Content
    request:
      url: "{{baseUrl}}/users/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthorized
