    description: Default Response
    request:
      url: "{{baseUrl}}/replays/:matchId/zip"
      method: GET
      params:
        - name: matchId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "Success": false,
            "AddedReplay": ""
          }
  - name: 403 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/replays/:matchId/zip"
      method: GET
      params:
        - name: matchId
          value: ""
          type: path
    response:
      status: 403
      statusText: Forbidden
