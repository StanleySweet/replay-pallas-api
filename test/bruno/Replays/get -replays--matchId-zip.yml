info:
  name: get /replays/:matchId/zip
  type: http
  seq: 2
  tags:
    - Replays

http:
  method: GET
  url: "{{baseUrl}}/replays/:matchId/zip"
  params:
    - name: matchId
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
