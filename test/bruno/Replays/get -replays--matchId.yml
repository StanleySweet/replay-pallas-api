info:
  name: get /replays/:matchId
  type: http
  seq: 3
  tags:
    - Replays

http:
  method: GET
  url: "{{baseUrl}}/replays/:matchId"
  params:
    - name: matchId
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

