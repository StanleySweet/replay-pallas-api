info:
  name: post /local-ratings/civilization-data
  type: http
  seq: 2
  tags:
    - Local_Ratings

http:
  method: POST
  url: "{{baseUrl}}/local-ratings/civilization-data"
  body:
    type: json
    data: |-
      {
        "player": "",
        "rank": 0,
        "players": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Default Response
    request:
      url: "{{baseUrl}}/local-ratings/civilization-data"
      method: POST
      body:
        type: json
        data: |-
          {
            "player": "",
            "rank": 0,
            "players": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "civKeys": [],
            "civRatings": [],
            "civMatches": [],
            "advantages": []
          }
  - name: 204 Response
    description: No Content
    request:
      url: "{{baseUrl}}/local-ratings/civilization-data"
      method: POST
      body:
        type: json
        data: |-
          {
            "player": "",
            "rank": 0,
            "players": 0
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/local-ratings/civilization-data"
      method: POST
      body:
        type: json
        data: |-
          {
            "player": "",
            "rank": 0,
            "players": 0
          }
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
