          {
            "categories": [
              {
                "label": "",
                "tooltip": "",
                "options": [
                  {
                    "type": "",
                    "label": "",
                    "tooltip": "",
                    "config": "",
                    "val": "",
                    "min": 0,
                    "max": 0,
                    "dependencies": [],
                    "list": [
                      {
                        "value": "",
                        "label": ""
                      }
                    ]
                  }
                ]
              }
            ],
            "values": {}
          }
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/local-ratings/options"
      method: GET
