info:
  name: get /local-ratings/users
  type: http
  seq: 1
  tags:
    - Local_Ratings

http:
  method: GET
  url: "{{baseUrl}}/local-ratings/users"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Default Response
    request:
      url: "{{baseUrl}}/local-ratings/users"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "rank": 0,
              "rating": "",
              "matches": 0,
              "user": {
                "id": 0,
                "nick": "",
                "role": 0,
                "creation_date": ""
              }
            }
          ]
  - name: 204 Response
    description: No Content
    request:
      url: "{{baseUrl}}/local-ratings/users"
      method: GET
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/local-ratings/users"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
