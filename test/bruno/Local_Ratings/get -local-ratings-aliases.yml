info:
  name: get /local-ratings/aliases
  type: http
  seq: 6
  tags:
    - Local_Ratings

http:
  method: GET
  url: "{{baseUrl}}/local-ratings/aliases"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Default Response
    request:
      url: "{{baseUrl}}/local-ratings/aliases"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "primary": "",
              "aliases": []
            }
          ]
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{baseUrl}}/local-ratings/aliases"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
